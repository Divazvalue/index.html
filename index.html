<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divaz Value 💄</title>
<style>
:root {
  --bg-main: #0a0d14;
  --bg-card: rgba(22, 28, 42, 0.75);
  --bg-slot: #121722;
  --border-color: rgba(255, 255, 255, 0.08);
  --border-focus: #6366f1;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent-purple: #6366f1;
  --accent-purple-glow: rgba(99, 102, 241, 0.35);
  --accent-red: #ef4444;
  --accent-green: #10b981;
  --accent-gold: #f59e0b;
  --radius-lg: 14px;
  --radius-md: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg-main); color: var(--text-main); line-height: 1.5; max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 16px; position: relative; }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

/* Header & Status */
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.brand-logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.status-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: var(--accent-green); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-bottom: 16px; }
.pulse-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }

/* Controls */
.search-input { width: 100%; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); color: var(--text-main); font-size: 14px; outline: none; transition: 0.2s; margin-bottom: 14px; backdrop-filter: blur(8px); }
.search-input:focus { border-color: var(--border-focus); box-shadow: 0 0 12px var(--accent-purple-glow); }

.filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; scrollbar-width: none; }
.filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
.filter-btn.active { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); box-shadow: 0 4px 12px var(--accent-purple-glow); }
.filter-btn.trade-mode { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: var(--accent-red); }
.filter-btn.trade-mode:hover { background: var(--accent-red); color: #fff; }

/* Grid Layout */
.section-header { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.item-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 10px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; backdrop-filter: blur(8px); }
.item-card:hover { border-color: var(--accent-purple); transform: translateY(-2px); }
.card-img-wrap { width: 100%; aspect-ratio: 1; border-radius: var(--radius-md); background: var(--bg-slot); overflow: hidden; margin-bottom: 8px; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.card-tag { font-size: 9px; font-weight: 700; background: rgba(255, 255, 255, 0.05); color: var(--text-muted); padding: 2px 6px; border-radius: 4px; text-transform: uppercase; display: inline-block; margin-bottom: 4px; }
.card-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.card-val { font-size: 12px; font-weight: 700; color: var(--accent-gold); }

/* Views (Pages) */
.view-panel { display: none; position: fixed; inset: 0; background: var(--bg-main); z-index: 100; overflow-y: auto; padding: 16px; opacity: 0; transition: opacity 0.2s ease; }
.view-panel.active { display: block; opacity: 1; }
.view-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.icon-btn { background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; padding: 4px; }

/* Details View */
.detail-preview { width: 100%; aspect-ratio: 1; border-radius: var(--radius-lg); background: var(--bg-slot); overflow: hidden; margin-bottom: 16px; border: 1px solid var(--border-color); }
.detail-preview img { width: 100%; height: 100%; object-fit: cover; }
.detail-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; }
.detail-card h2 { font-size: 18px; margin-bottom: 6px; }
.detail-card .price { font-size: 16px; font-weight: 700; color: var(--accent-gold); }

/* Comments */
.comments-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px; }
.comments-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.comment-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.form-input { width: 100%; padding: 10px; background: var(--bg-slot); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-main); font-size: 13px; outline: none; }
.btn-submit { padding: 10px; background: var(--accent-purple); border: none; border-radius: var(--radius-md); color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.cooldown-info { font-size: 12px; color: var(--accent-gold); margin-bottom: 12px; display: none; align-items: center; gap: 6px; }
.cooldown-info.active { display: flex; }
.comment-feed { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
.comment-item { background: var(--bg-slot); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px; }
.comment-author { font-size: 12px; font-weight: 700; color: #818cf8; }
.comment-time { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
.comment-text { font-size: 13px; }

/* Trade Simulator */
.trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.trade-column { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 12px; }
.trade-column h4 { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); text-align: center; margin-bottom: 10px; }
.slots-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.slot { aspect-ratio: 1; border: 1.5px dashed var(--border-color); border-radius: var(--radius-md); background: var(--bg-slot); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; transition: 0.2s; font-size: 16px; color: var(--text-muted); }
.slot.filled { border-style: solid; border-color: var(--accent-purple); }
.slot img { width: 100%; height: 100%; object-fit: cover; }
.slot-sum { text-align: center; font-size: 12px; font-weight: 700; color: var(--accent-gold); border-top: 1px solid var(--border-color); padding-top: 6px; }

.trade-verdict { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.verdict-val { font-size: 18px; font-weight: 800; }
.verdict-val.profit { color: var(--accent-green); }
.verdict-val.loss { color: var(--accent-red); }
.verdict-val.fair { color: var(--accent-gold); }

/* Modal Picker */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 200; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
.modal-overlay.active { display: flex; }
.modal-content { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 360px; max-height: 75vh; overflow-y: auto; padding: 16px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.picker-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 8px; cursor: pointer; }
.picker-item-img { width: 100%; aspect-ratio: 1; border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
.picker-item-img img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<!-- MAIN VIEW -->
<div id="mainView">
  <header>
    <div class="brand-logo">Divaz Value 💄</div>
    <div style="color: var(--text-muted); cursor: pointer;">☰</div>
  </header>
  <div class="status-tag"><span class="pulse-dot"></span> Official System • Realtime Sync</div>
  
  <input type="text" id="searchInput" class="search-input" placeholder="Tìm tên sản phẩm...">
  
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all" data-title="Tất Cả Vật Phẩm">All Items</button>
    <button class="filter-btn trade-mode" id="btnOpenTrade">TRADE SIM</button>
    <button class="filter-btn" data-filter="katana" data-title="Katana Collection">Katana</button>
    <button class="filter-btn" data-filter="style" data-title="Style Outfits">Style</button>
    <button class="filter-btn" data-filter="nail" data-title="Nail Art">Nail</button>
    <button class="filter-btn" data-filter="shoes" data-title="Shoes & Kicks">Shoes</button>
  </div>

  <h2 class="section-header" id="sectionTitle">Tất Cả Vật Phẩm</h2>
  <div class="items-grid" id="itemsGrid"></div>
</div>

<!-- DETAIL VIEW -->
<div class="view-panel" id="detailView">
  <div class="view-header">
    <button class="icon-btn" id="btnBackFromDetail">←</button>
    <h3 id="detailHeaderTitle">Chi Tiết Vật Phẩm</h3>
  </div>
  <div class="detail-preview"><img id="detailImage" src="" alt=""></div>
  <div class="detail-card">
    <h2 id="detailTitle">-</h2>
    <div class="price" id="detailPrice">Giá trị: 0</div>
  </div>

  <div class="comments-box">
    <h3>Thảo Luận & Bình Luận</h3>
    <div class="comment-form">
      <input type="text" id="commentAuthor" class="form-input" placeholder="Tên của bạn...">
      <input type="text" id="commentContent" class="form-input" placeholder="Viết bình luận...">
      <button class="btn-submit" id="btnSendComment">Gửi Bình Luận</button>
    </div>
    <div class="cooldown-info" id="cooldownNotice">
      ⏱️ Vui lòng chờ <span id="cooldownTimerSec">60</span>s để bình luận tiếp.
    </div>
    <div class="comment-feed" id="commentFeed"></div>
  </div>
</div>

<!-- TRADE VIEW -->
<div class="view-panel" id="tradeView">
  <div class="view-header">
    <button class="icon-btn" id="btnBackFromTrade">←</button>
    <h3 style="color: var(--accent-red)">GIAO DỊCH GIẢ LẬP</h3>
  </div>

  <div class="trade-grid">
    <div class="trade-column">
      <h4>BẠN CÓ</h4>
      <div class="slots-wrapper" id="yourSlots"></div>
      <div class="slot-sum" id="yourTotal">0</div>
    </div>
    <div class="trade-column">
      <h4>ĐỐI PHƯƠNG</h4>
      <div class="slots-wrapper" id="theirSlots"></div>
      <div class="slot-sum" id="theirTotal">0</div>
    </div>
  </div>

  <div class="trade-verdict">
    <span style="font-size: 12px; color: var(--text-muted);">KẾT QUẢ</span>
    <div>
      <span class="verdict-val fair" id="tradeDiff">0</span>
      <span id="tradeStatus" style="font-size: 12px; font-weight: 700; margin-left: 6px;">FAIR</span>
    </div>
  </div>

  <button class="btn-submit" id="btnResetTrade" style="background: #1e293b; width: 100%;">Làm Mới Giao Dịch</button>
</div>

<!-- MODAL ITEM PICKER -->
<div class="modal-overlay" id="itemPickerModal">
  <div class="modal-content">
    <div class="modal-header">
      <h4>Chọn Vật Phẩm</h4>
      <button class="icon-btn" id="btnCloseModal">×</button>
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</div>

<script>
// ===== APP ENGINE (ES6 CLASS ARCHITECTURE) =====
class DivazValueApp {
  constructor() {
    this.database = [
      { id: 'item1', name: 'Cosmo Katana', value: 10000, img: 'https://i.postimg.cc/fLHT19kM/Screenshot-2026-0816-134912.jpg', cat: 'katana' },
      { id: 'item2', name: 'Style Ninja', value: 1455, img: 'https://i.postimg.cc/7hGGVVX6/1786863889127.png', cat: 'style' },
      { id: 'item3', name: 'Icy', value: 3000, img: 'https://i.postimg.cc/5Nbx4pdL/1786861203962.png', cat: 'nail' },
      { id: 'item4', name: 'Void Skull', value: 600, img: 'https://i.postimg.cc/NjGf4Ddb/1786861234119.png', cat: 'shoes' }
    ];

    this.state = {
      activeFilter: 'all',
      searchQuery: '',
      selectedItemId: null,
      cooldownInterval: null,
      tradeSlots: {
        your: Array(9).fill(null),
        their: Array(9).fill(null)
      },
      activeSlotTarget: null
    };

    this.initDOM();
    this.bindEvents();
    this.renderCatalog();
  }

  initDOM() {
    this.dom = {
      mainView: document.getElementById('mainView'),
      detailView: document.getElementById('detailView'),
      tradeView: document.getElementById('tradeView'),
      itemsGrid: document.getElementById('itemsGrid'),
      searchInput: document.getElementById('searchInput'),
      filterBar: document.getElementById('filterBar'),
      sectionTitle: document.getElementById('sectionTitle'),
      // Detail DOMs
      detailImage: document.getElementById('detailImage'),
      detailTitle: document.getElementById('detailTitle'),
      detailPrice: document.getElementById('detailPrice'),
      commentAuthor: document.getElementById('commentAuthor'),
      commentContent: document.getElementById('commentContent'),
      commentFeed: document.getElementById('commentFeed'),
      btnSendComment: document.getElementById('btnSendComment'),
      cooldownNotice: document.getElementById('cooldownNotice'),
      cooldownTimerSec: document.getElementById('cooldownTimerSec'),
      // Trade DOMs
      yourSlots: document.getElementById('yourSlots'),
      theirSlots: document.getElementById('theirSlots'),
      yourTotal: document.getElementById('yourTotal'),
      theirTotal: document.getElementById('theirTotal'),
      tradeDiff: document.getElementById('tradeDiff'),
      tradeStatus: document.getElementById('tradeStatus'),
      modal: document.getElementById('itemPickerModal'),
      pickerGrid: document.getElementById('pickerGrid')
    };
  }

  bindEvents() {
    // Search & Filter
    this.dom.searchInput.addEventListener('input', (e) => {
      this.state.searchQuery = e.target.value.toLowerCase().trim();
      this.renderCatalog();
    });

    this.dom.filterBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      if (btn.id === 'btnOpenTrade') {
        this.openView('trade');
        this.renderTradeSimulator();
        return;
      }
      this.dom.filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      this.state.activeFilter = btn.dataset.filter;
      this.dom.sectionTitle.textContent = btn.dataset.title;
      this.renderCatalog();
    });

    // Navigation Back
    document.getElementById('btnBackFromDetail').onclick = () => this.openView('main');
    document.getElementById('btnBackFromTrade').onclick = () => this.openView('main');

    // Comment System
    this.dom.btnSendComment.onclick = () => this.handleCommentSubmit();
    this.dom.commentContent.onkeypress = (e) => e.key === 'Enter' && this.handleCommentSubmit();

    // Trade Reset & Modal
    document.getElementById('btnResetTrade').onclick = () => {
      this.state.tradeSlots.your.fill(null);
      this.state.tradeSlots.their.fill(null);
      this.renderTradeSimulator();
    };

    document.getElementById('btnCloseModal').onclick = () => this.closePickerModal();
    this.dom.modal.onclick = (e) => e.target === this.dom.modal && this.closePickerModal();
  }

  openView(viewName) {
    [this.dom.mainView, this.dom.detailView, this.dom.tradeView].forEach(v => v.classList.remove('active'));
    if (viewName === 'main') this.dom.mainView.style.display = 'block';
    if (viewName === 'detail') this.dom.detailView.classList.add('active');
    if (viewName === 'trade') this.dom.tradeView.classList.add('active');
    window.scrollTo(0, 0);
  }

  renderCatalog() {
    this.dom.itemsGrid.innerHTML = '';
    const filtered = this.database.filter(item => {
      const matchCat = this.state.activeFilter === 'all' || item.cat === this.state.activeFilter;
      const matchSearch = !this.state.searchQuery || item.name.toLowerCase().includes(this.state.searchQuery);
      return matchCat && matchSearch;
    });

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div class="card-img-wrap"><img src="${item.img}" alt="${item.name}"></div>
        <span class="card-tag">${item.cat}</span>
        <div class="card-title">${item.name}</div>
        <div class="card-val">Value: ${item.value.toLocaleString()}</div>
      `;
      card.onclick = () => this.openItemDetails(item);
      this.dom.itemsGrid.appendChild(card);
    });
  }

  openItemDetails(item) {
    this.state.selectedItemId = item.id;
    this.dom.detailImage.src = item.img;
    this.dom.detailTitle.textContent = item.name;
    this.dom.detailPrice.textContent = `Giá trị: ${item.value.toLocaleString()}`;

    // Load User Saved Name
    const savedName = localStorage.getItem('divaz_user');
    if (savedName) this.dom.commentAuthor.value = savedName;

    this.checkCommentCooldown();
    this.renderComments();
    this.openView('detail');
  }

  // ===== COMMENTS LOGIC =====
  handleCommentSubmit() {
    const author = this.dom.commentAuthor.value.trim() || 'Người dùng Ẩn danh';
    const content = this.dom.commentContent.value.trim();
    if (!content) return;

    const cooldownEnd = parseInt(localStorage.getItem('divaz_cooldown') || '0');
    if (Date.now() < cooldownEnd) return;

    localStorage.setItem('divaz_user', author);
    const comments = JSON.parse(localStorage.getItem(`comments_${this.state.selectedItemId}`) || '[]');

    const newComment = {
      author,
      content,
      time: new Date().toLocaleDateString('vi-VN') + ' ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
    };

    comments.push(newComment);
    if (comments.length > 20) comments.shift();
    localStorage.setItem(`comments_${this.state.selectedItemId}`, JSON.stringify(comments));

    this.dom.commentContent.value = '';
    this.renderComments();

    // Trigger 60s cooldown
    const nextCooldown = Date.now() + 60000;
    localStorage.setItem('divaz_cooldown', nextCooldown.toString());
    this.startCooldownTimer(60);
  }

  checkCommentCooldown() {
    const cooldownEnd = parseInt(localStorage.getItem('divaz_cooldown') || '0');
    const remainSec = Math.ceil((cooldownEnd - Date.now()) / 1000);
    if (remainSec > 0) this.startCooldownTimer(remainSec);
    else this.stopCooldownTimer();
  }

  startCooldownTimer(seconds) {
    this.dom.cooldownNotice.classList.add('active');
    this.dom.btnSendComment.disabled = true;
    this.dom.commentContent.disabled = true;

    if (this.state.cooldownInterval) clearInterval(this.state.cooldownInterval);
    let current = seconds;
    this.dom.cooldownTimerSec.textContent = current;

    this.state.cooldownInterval = setInterval(() => {
      current--;
      this.dom.cooldownTimerSec.textContent = current;
      if (current <= 0) this.stopCooldownTimer();
    }, 1000);
  }
